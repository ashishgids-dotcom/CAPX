name: capx_app
description: "CAPX - Mass-market financial & business education app (educational tool only, not licensed advisory)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  # Floor bumped to track a recent stable Flutter line (verified via web
  # search — Flutter stable was at 3.44.x as of mid-2026). Bump further as
  # newer stables ship; this is a floor, not a pin.
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Networking (with caching for low-tier 3G/4G networks)
  dio: ^5.5.0+1
  dio_cache_interceptor: ^3.5.0
  dio_cache_interceptor_hive_store: ^3.2.2
  connectivity_plus: ^6.0.5

  # Local persistence
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # Charts / Data viz
  fl_chart: ^0.68.0

  # Audio playback (localized dialect summaries)
  just_audio: ^0.9.40

  # PDF generation (client-side blueprint export)
  pdf: ^3.11.1
  printing: ^5.13.1
  path_provider: ^2.1.4

  # Marquee disclaimer widget
  marquee: ^2.3.0

  # UI polish
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.3
  shimmer: ^3.0.0
  fluttertoast: ^8.2.8
  intl: ^0.19.0

  # Deep-linking (WhatsApp intent / dialer / maps)
  url_launcher: ^6.3.0

  # Calendar scheduling (consultation slots)
  table_calendar: ^3.1.2

  # Icons
  cupertino_icons: ^1.0.8

  # Routing
  go_router: ^14.2.7

  # Env/config
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
   # - .env

  # fonts:
  #   - family: NotoSansDevanagari
  #     fonts:
  #       - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
