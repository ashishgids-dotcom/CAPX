workflows:
  capx-android-apk:
    name: CAPX - Android APK Build
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
      groups:
        # Create this group in Codemagic UI (Teams > your team > Environment
        # variables) once you're ready to sign a real release build. Until
        # then, this workflow builds a working DEBUG apk with no signing
        # needed at all.
        - capx_keystore
      vars:
        PACKAGE_NAME: "com.example.capx_app"
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build debug APK (no signing needed)
        script: |
          flutter build apk --debug
      # --- Uncomment this block once your keystore + env vars are set up
      # in the Codemagic UI (see CAPX_GitHub_Codemagic_Guide.md) to also
      # produce a signed release APK in the same build ---
      # - name: Build release APK (signed)
      #   script: |
      #     echo $CM_KEYSTORE | base64 --decode > /tmp/keystore.jks
      #     flutter build apk --release \
      #       --build-name=1.0.0 \
      #       --build-number=$PROJECT_BUILD_NUMBER
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
